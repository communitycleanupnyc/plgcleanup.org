# Keeps dependencies current with minimal oversight: once a month Dependabot
# opens at most one PR for npm and one for GitHub Actions, each bundling every
# pending update. Merge them after CI (see ci.yml) passes. Vulnerability alerts
# still arrive as they're published (the repo's Security tab); the schedule only
# affects these PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for everything, majors included, so a month is one notification.
      # The majors that could break the site are ignored below, so the only ones
      # that land here are dev tools; if one turns the PR red, it holds up the
      # rest until it's fixed.
      all-npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native compiler) doesn't yet expose the API that
      # `astro check` needs. Stay on the 5.x line until Astro supports it.
      # Track: https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # Majors below are held deliberately. CI builds the site but never executes
      # the client JavaScript, so a major that silently kills the mobile menu, the
      # carousel, or the countdown would arrive as an ordinary green PR — and this
      # repo's merge instruction to non-technical editors is "merge it when CI is
      # green". Minors and patches still flow automatically.
      #
      # To take one of these on: ask the Claude agent to read the migration guide,
      # do the upgrade, then click through the mobile menu, the carousel (open a
      # testimonial, arrows, swipe), and the countdown copy in `npm run preview`.
      - dependency-name: astro
        update-types: [version-update:semver-major]
      - dependency-name: embla-carousel
        update-types: [version-update:semver-major]
      # sharp must additionally stay inside the range Astro itself declares
      # (^0.34.0 as of astro 6.4.8) — see "Dependency pins" in the README.
      #
      # NOTE the extra semver-minor hold, which the others don't need: sharp is a
      # 0.x package, so 0.34 → 0.35 is a *minor* bump by semver rules even though
      # it is a breaking release. A major-only ignore does not catch it, and
      # Dependabot duly proposed 0.35.3 in the grouped minor PR. Verified: taking
      # it installs 0.35 at the root while npm keeps a nested 0.34 under astro —
      # two copies of a native module, with astro's image pipeline still on the
      # old one. Drop this line when astro's declared range reaches ^0.35.
      - dependency-name: sharp
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
