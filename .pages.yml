# Pages CMS (https://pagescms.org) — a form-based editing UI for non-technical
# editors, backed by the plain Markdown in src/content/ and the cleanup dates in
# src/data/schedule.json. Everything stays plain files + git, validated by Astro at
# build time, so there is no lock-in.
#
# This config is a THIN ADAPTER over those files: another Astro-compatible CMS
# (Decap, Sveltia) could replace Pages CMS by writing its own config against the
# same files — no content migration. Keep it that way; don't let CMS-specific
# shapes leak into the content.

settings:
  content:
    # Merge mode: when saving, preserve any keys already in a file that aren't
    # modeled below, instead of rewriting the file from this schema alone. Cheap
    # insurance against dropping a field a future edit adds here but not there.
    #
    # NOTE the nesting: `settings.content` must be an OBJECT and the commit
    # messages must sit under `commit.templates`. A flat `content: true` with a
    # flat `commit:` map parses without complaint and does nothing at all — both
    # merge mode and the commit messages were silently off before this was fixed.
    merge: true
  commit:
    # The token is {path} — {filename} is not a Pages CMS token and would have
    # been committed literally.
    templates:
      create: "Add {path} (via Pages CMS)"
      update: "Update {path} (via Pages CMS)"
      delete: "Delete {path} (via Pages CMS)"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS)"

media:
  - name: gallery-photos
    label: Gallery photos
    input: src/assets/gallery
    output: ../../assets/gallery
    extensions: [jpg, jpeg, png, webp]

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    # The filename IS the URL (faq.md → /faq), so it must not carry a date. Pages
    # CMS's default for a collection is "{year}-{month}-{day}-{primary}.md",
    # which would publish a new Contact page at /2026-09-01-contact.
    #
    # Field values in the template are slugified, so "Community Partners" becomes
    # community-partners.md. `field: create` shows the filename box only when
    # making a NEW page — renaming an existing one moves its URL and breaks the
    # footer link to it, which should be a deliberate act, not a side effect of
    # rewording a title.
    filename:
      template: "{fields.title}.md"
      field: create
    view:
      fields: [title, navMode]
    fields:
      - name: title
        label: Page title (browser tab)
        type: string
        required: true
        description: >-
          Short title for the browser tab and search results — e.g. "FAQ". The
          site shows it as "FAQ | Community Cleanup PLG"; you don't type the site
          name. This is separate from the page's on-screen heading, which you
          write in the Page content below.
      - { name: description, label: Social description, type: text, required: true }
      - name: navMode
        label: Nav style
        type: select
        default: static
        options:
          values: [ticker, static]
      - { name: body, label: Page content, type: rich-text, required: true }
      # Sections that start folded up. Type the heading exactly as it appears in
      # the page content above — "Team" folds the "## Team" section, heading and
      # all, into a dropdown a reader clicks to open. Leave the list empty and
      # the whole page reads straight through, which is the right answer for
      # most pages. A name that matches no heading fails the build (with a
      # message naming it) rather than silently doing nothing.
      - name: collapse
        label: Sections that fold up (optional)
        type: string
        list: true
        required: false
        description: >-
          Optional. A heading from the page content that should start collapsed,
          e.g. "Team" — readers see the heading with an arrow and click to
          unfold the rest. Capitalisation and spacing don't matter, but the
          words must match a heading on the page.

  - name: gallery
    label: Gallery
    type: collection
    path: src/content/gallery
    filename: "{fields.title}.md"
    view:
      fields: [title, caption, order]
      sort: [order]
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: >-
          First name is fine. If a title repeats — a second Abby — write "Abby R."
          so the two don't overwrite each other (the title becomes the filename).
      - { name: caption, label: Pull quote, type: string, required: true }
      - name: alt
        label: Photo description (alt text)
        type: string
        required: true
        description: >-
          What is in the photo, for people who can't see it — screen reader users,
          and anyone whose image fails to load. Describe the picture, not the
          person's role: "Abby laughing while emptying a grabber into a blue bag"
          beats "volunteer photo". Don't start with "Photo of" or "Image of".
      - { name: image, label: Photo, type: image, media: gallery-photos, required: true }
      - name: order
        label: Display order
        type: number
        description: >-
          A unique number. Lowest shows first in the carousel and is the photo
          used in link previews; the second-lowest is the highlighted card.
      # `required: false` alone does NOT make a patterned field optional in Pages
      # CMS: an untouched string field holds "", the pattern is checked against
      # it regardless, and the failure blocks saving the whole entry — not just
      # this field. So the regex has to accept the blank case itself (`^\s*$|`).
      # Without it, editors are forced to invent a value to save any edit.
      # Pages CMS drops empty fields on save, so blank means the key is simply
      # absent from the file — which the site treats as "centered". A stray space
      # does get written; content.config.ts trims it back to "absent" so that
      # can't fail the build either.
      - name: focusPosition
        label: Photo focus (optional)
        type: string
        required: false
        description: >-
          Leave this blank unless the photo crops badly — blank centers it, which
          is right for almost every photo. To nudge it, write two percentages:
          across, then down. "50% 30%" is centered left-to-right and higher up;
          "50% 0%" is the very top.
        pattern:
          regex: "^\\s*$|^\\s*\\d{1,3}% \\d{1,3}%\\s*$"
          message: Leave it blank, or write two percentages separated by a space, like 50% 30% (across, then down).
      - { name: body, label: Full text (reveal panel), type: rich-text, required: true }

  # The monthly job. Every cleanup lives in one repeatable list, so an editor
  # adds next month's dates and deletes last month's in the same place, and
  # src/data/schedule.ts picks the next one out of it on every build. Nothing
  # here says which cleanup is "next": the date does.
  #
  # The list is a FIELD (`cleanups`), not the whole file. Pages CMS can edit a
  # top-level JSON array too — `list: true` on this entry — but that path tests
  # `list === true` exactly, so it takes no options: no `min`, and no collapsed
  # one-line summary per row. A schedule is read as a list far more often than it
  # is edited, so the summary is worth the extra key in the JSON.
  - name: schedule
    label: Schedule
    type: file
    path: src/data/schedule.json
    format: json
    description: >-
      Every cleanup, past and future. Add the month ahead, one row each; delete
      old rows whenever you like. The site lists the next four, points the Join
      page and the countdown at the first one still to come, and ignores rows
      whose date has passed — so nothing here needs moving after a cleanup
      happens. Type the rows in any order; the site sorts them by date.
    fields:
      - name: cleanups
        label: Cleanups
        type: object
        list:
          # At least one row: the Join page has to name a date. No maximum —
          # schedule as far ahead as you like. `collapsible` is not optional
          # inside this block; a bare `min:` makes Pages CMS reject the config.
          min: 1
          collapsible:
            collapsed: true
            # Every row is legible without opening it, so the whole schedule
            # reads as a list you can check and prune.
            summary: "{fields.date} · {fields.startTime} · {fields.corner}"
        fields:
          # A date picker, not free text: Pages CMS saves yyyy-MM-dd, which is
          # exactly what schedule.ts parses. The regex stays as well — edits made
          # through the GitHub web editor bypass this form entirely.
          - name: date
            label: Date (year-month-day)
            type: date
            required: true
            description: "The day of the cleanup, e.g. 2026-07-18."
            pattern:
              regex: "^\\d{4}-\\d{2}-\\d{2}$"
              message: Write it like 2026-07-18 (year-month-day).
          # schedule.ts accepts 12-hour times only ("10:00am", "2pm"). Without
          # these patterns "14:00" saves fine here and fails the build a minute
          # later. The defaults are the usual hour, so most rows need the date
          # and the corner and nothing else.
          - name: startTime
            label: Start time
            type: string
            required: true
            default: "2pm"
            description: "e.g. 10:00am, 9:30am, 2pm"
            pattern:
              regex: "^\\s*\\d{1,2}(:[0-5]\\d)?\\s*[AaPp][Mm]\\s*$"
              message: Write it like 10:00am, 9:30am, or 2pm.
          - name: endTime
            label: End time
            type: string
            required: true
            default: "3pm"
            description: "e.g. 11:00am"
            pattern:
              regex: "^\\s*\\d{1,2}(:[0-5]\\d)?\\s*[AaPp][Mm]\\s*$"
              message: Write it like 10:00am, 9:30am, or 2pm.
          - name: corner
            label: Street corner
            type: string
            required: true
            description: "Where everyone meets, e.g. Clarkson Ave & Bedford Ave. The map link is built from it."

  - name: stats
    label: Statistics
    type: file
    path: src/data/stats.json
    format: json
    fields:
      - name: poundsCollected
        label: Pounds collected
        type: number
        required: true
        description: Total pounds of trash collected this year. Plain number, no commas (e.g. 2972.55).
      - name: volunteerCount
        label: Volunteer count
        type: number
        required: true
        description: How many volunteers have joined so far.
