# Pages CMS (https://pagescms.org) — a form-based editing UI for non-technical
# editors, backed by the plain Markdown in src/content/ and the event data in
# src/data/event.json. Everything stays plain files + git, validated by Astro at
# build time, so there is no lock-in.
#
# This config is a THIN ADAPTER over those files: another Astro-compatible CMS
# (Decap, Sveltia) could replace Pages CMS by writing its own config against the
# same files — no content migration. Keep it that way; don't let CMS-specific
# shapes leak into the content.

settings:
  content:
    # Merge mode: when saving, preserve any keys already in a file that aren't
    # modeled below, instead of rewriting the file from this schema alone. Cheap
    # insurance against dropping a field a future edit adds here but not there.
    #
    # NOTE the nesting: `settings.content` must be an OBJECT and the commit
    # messages must sit under `commit.templates`. A flat `content: true` with a
    # flat `commit:` map parses without complaint and does nothing at all — both
    # merge mode and the commit messages were silently off before this was fixed.
    merge: true
  commit:
    # The token is {path} — {filename} is not a Pages CMS token and would have
    # been committed literally.
    templates:
      create: "Add {path} (via Pages CMS)"
      update: "Update {path} (via Pages CMS)"
      delete: "Delete {path} (via Pages CMS)"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS)"

media:
  - name: testimonial-photos
    label: Testimonial photos
    input: src/assets/testimonials
    output: ../../assets/testimonials
    extensions: [jpg, jpeg, png, webp]

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    # The filename IS the URL (faq.md → /faq), so it must not carry a date. Pages
    # CMS's default for a collection is "{year}-{month}-{day}-{primary}.md",
    # which would publish a new Contact page at /2026-09-01-contact.
    #
    # Field values in the template are slugified, so "Community Partners" becomes
    # community-partners.md. `field: create` shows the filename box only when
    # making a NEW page — renaming an existing one moves its URL and breaks the
    # footer link to it, which should be a deliberate act, not a side effect of
    # rewording a title.
    filename:
      template: "{fields.title}.md"
      field: create
    view:
      fields: [title, navMode]
    fields:
      - name: title
        label: Page title (browser tab)
        type: string
        required: true
        description: >-
          Short title for the browser tab and search results — e.g. "FAQ". The
          site shows it as "FAQ | Community Cleanup PLG"; you don't type the site
          name. This is separate from the page's on-screen heading, which you
          write in the Page content below.
      - { name: description, label: Social description, type: text, required: true }
      - name: navMode
        label: Nav style
        type: select
        default: static
        options:
          values: [ticker, static]
      - { name: body, label: Page content, type: rich-text, required: true }

  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    filename: "{fields.name}.md"
    view:
      fields: [name, quote, order]
      sort: [order]
    fields:
      - name: name
        label: Name
        type: string
        required: true
        description: >-
          First name is fine. If a name repeats — a second Abby — write "Abby R."
          so the two don't overwrite each other (the name becomes the filename).
          The photo's alt text is written for you from this name.
      - { name: quote, label: Pull quote, type: string, required: true }
      - { name: image, label: Photo, type: image, media: testimonial-photos, required: true }
      - name: order
        label: Display order
        type: number
        description: >-
          A unique number. Lowest shows first in the carousel and is the photo
          used in link previews; the second-lowest is the highlighted card.
      - name: focusPosition
        label: Photo focus (e.g. 50% 30%)
        type: string
        required: false
        description: Optional. Which part of the photo to keep centered when cropped, e.g. "50% 30%".
        pattern:
          regex: "^\\d{1,3}% \\d{1,3}%$"
          message: Write two percentages separated by a space, like 50% 30% (across, then down).
      - { name: body, label: Full testimonial, type: rich-text, required: true }

  - name: event
    label: Event details
    type: file
    path: src/data/event.json
    format: json
    fields:
      # A date picker, not free text: Pages CMS saves yyyy-MM-dd, which is exactly
      # what event.ts parses. The regex stays as well — edits made through the
      # GitHub web editor bypass this form entirely.
      - name: date
        label: Date (year-month-day)
        type: date
        required: true
        description: "e.g. 2026-07-18"
        pattern:
          regex: "^\\d{4}-\\d{2}-\\d{2}$"
          message: Write it like 2026-07-18 (year-month-day).
      # event.ts accepts 12-hour times only ("10:00am", "2pm"). Without these
      # patterns "14:00" saves fine here and fails the build a minute later.
      - name: startTime
        label: Start time
        type: string
        required: true
        description: "e.g. 10:00am, 9:30am, 2pm"
        pattern:
          regex: "^\\s*\\d{1,2}(:[0-5]\\d)?\\s*[AaPp][Mm]\\s*$"
          message: Write it like 10:00am, 9:30am, or 2pm.
      - name: endTime
        label: End time
        type: string
        required: true
        description: "e.g. 11:00am"
        pattern:
          regex: "^\\s*\\d{1,2}(:[0-5]\\d)?\\s*[AaPp][Mm]\\s*$"
          message: Write it like 10:00am, 9:30am, or 2pm.
      - name: corner
        label: Street corner
        type: string
        required: true
        description: "e.g. Clarkson Ave & Bedford Ave"

  - name: stats
    label: Statistics
    type: file
    path: src/data/stats.json
    format: json
    fields:
      - name: poundsCollected
        label: Pounds collected
        type: number
        required: true
        description: Total pounds of trash collected this year. Plain number, no commas (e.g. 2972.55).
      - name: volunteerCount
        label: Volunteer count
        type: number
        required: true
        description: How many volunteers have joined so far.
